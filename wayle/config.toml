# Wayle configuration file
[general]
font-sans = "JetBrainsMono Nerd Font"
font-mono = "JetBrainsMono Nerd Font"

[bar]
scale = 0.90
padding-ends = 1.5
button-variant = "basic"
button-icon-size = 0.80

[[bar.layout]]
monitor = "*"
show = true
left = [
    "dashboard",
    "hyprland-workspaces",
]
center = ["window-title"]
right = [
    "volume",
    "network",
    "bluetooth",
    "battery",
    "systray",
    "clock",
    "notifications",
]

[styling.palette]
bg = "#11111b"
surface = "#181825"
elevated = "#1e1e2e"
fg = "#cdd6f4"
fg-muted = "#bac2de"
primary = "#b4befe"
red = "#f38ba8"
yellow = "#f9e2af"
green = "#a6e3a1"
blue = "#74c7ec"

[modules.clock]
format = "%H:%M"
dropdown-show-seconds = true

[modules.dashboard]
icon-color = "blue"

[modules.hyprland-workspaces]
label-size = 0.90
active-indicator = "underline"
active-color = "status-info"

[modules.window-title]
format = "{{ app }}"

[modules.window-title.icon-mappings]
"firefox" = "si-firefoxbrowser-symbolic"
"kitty" = "tb-cat-symbolic"

[osd]
margin = 50.0

[wallpaper]
engine-enabled = false
